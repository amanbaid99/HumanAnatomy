# Publishes the site to GitHub Pages. No build step: the repo root is the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/anatomy-web-app-cgyqjz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo the first time this runs, so no manual
        # visit to repository settings is needed.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
